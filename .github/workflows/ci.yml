# SPDX-License-Identifier: GPL-3.0-or-later
name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        id: python
        with:
          python-version: '3.13'
          architecture: x64
          update-environment: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: false
          path-type: minimal
      - name: Install verified pinned packages
        shell: msys2 {0}
        run: |
          set -eu
          dir=$(cygpath -u "$RUNNER_TEMP")/psmodern-packages
          mkdir -p "$dir"
          while read -r sum file; do
            case "$sum" in ''|'#'*) continue ;; esac
            curl -fsSL --retry 3 -o "$dir/$file" "https://repo.msys2.org/mingw/ucrt64/$file"
            echo "$sum  $dir/$file" | sha256sum -c --quiet
          done < .github/ci/msys2-packages.txt
          pacman -U --noconfirm "$dir"/*.pkg.tar.zst
          pacman -Q | grep '^mingw-w64-ucrt-x86_64-'
      - name: Configure, build and test
        shell: msys2 {0}
        env:
          PSMODERN_CI_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -eu
          dir=$(cygpath -u "$RUNNER_TEMP")/psmodern-z80-tests
          mkdir -p "$dir"
          base=https://raw.githubusercontent.com/rejunity/z80-from-schematics/6b1ffceab57561881e9cae429182dc3d4fc28038/tests/z80test
          while read -r sum file; do
            curl -fsSL --retry 3 -o "$dir/$file" "$base/$file"
            echo "$sum  $dir/$file" | sha256sum -c --quiet
          done <<'TESTS'
          4dbe34a28ed564ac782b538736e1a1c57c562876165a3294bd93af25ea3df653 z80flags.tap
          444582ddfa4d05711b6235e743ddf68295231e97ba92cc838c5d09a106c9a10f z80memptr.tap
          a35b3b269b58371015cf033f28a08ad1ac92cce6dd27b428caf67b7f9ce8f5b7 z80ccf.tap
          67e39cd3bbecedf1e406ea9ce99d55fc48c3b497e235f1c7406d1bc4406b7071 LICENSE.txt
          TESTS
          cmake -S . -B build-rel -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPSMODERN_ROM_TESTS=OFF -DPSMODERN_Z80_TEST_DIR="$(cygpath -m "$dir")" -DPython3_EXECUTABLE="$(cygpath -m "$PSMODERN_CI_PYTHON")"
          if grep -q NDEBUG build-rel/build.ninja; then
            echo 'Unexpected NDEBUG in build-rel.'; exit 1
          fi
          cmake --build build-rel
          ctest --test-dir build-rel --output-on-failure --no-tests=error
