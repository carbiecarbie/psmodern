name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        id: python
        with:
          python-version: '3.13'
          architecture: x64
          update-environment: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: false
          path-type: minimal
      - name: Install verified pinned packages
        shell: msys2 {0}
        run: |
          set -eu
          dir=$(cygpath -u "$RUNNER_TEMP")/psmodern-packages
          mkdir -p "$dir"
          while read -r sum file; do
            case "$sum" in ''|'#'*) continue ;; esac
            curl -fsSL --retry 3 -o "$dir/$file" "https://repo.msys2.org/mingw/ucrt64/$file"
            echo "$sum  $dir/$file" | sha256sum -c --quiet
          done < .github/ci/msys2-packages.txt
          pacman -U --noconfirm "$dir"/*.pkg.tar.zst
          pacman -Q | grep '^mingw-w64-ucrt-x86_64-'
      - name: Configure, build and test
        shell: msys2 {0}
        env:
          PSMODERN_CI_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -eu
          dir=$(cygpath -u "$RUNNER_TEMP")/psmodern-z80-tests
          mkdir -p "$dir"
          base=https://raw.githubusercontent.com/rejunity/z80-from-schematics/6b1ffceab57561881e9cae429182dc3d4fc28038/tests/z80test
          while read -r sum file; do
            curl -fsSL --retry 3 -o "$dir/$file" "$base/$file"
            echo "$sum  $dir/$file" | sha256sum -c --quiet
          done <<'TESTS'
          4dbe34a28ed564ac782b538736e1a1c57c562876165a3294bd93af25ea3df653 z80flags.tap
          444582ddfa4d05711b6235e743ddf68295231e97ba92cc838c5d09a106c9a10f z80memptr.tap
          a35b3b269b58371015cf033f28a08ad1ac92cce6dd27b428caf67b7f9ce8f5b7 z80ccf.tap
          67e39cd3bbecedf1e406ea9ce99d55fc48c3b497e235f1c7406d1bc4406b7071 LICENSE.txt
          TESTS
          # The ROM tests are registered with no ROM: every one must skip.
          cmake -S . -B build-rel -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPSMODERN_ROM_TESTS=ON -DPSMODERN_Z80_TEST_DIR="$(cygpath -m "$dir")" -DPython3_EXECUTABLE="$(cygpath -m "$PSMODERN_CI_PYTHON")"
          if grep -q NDEBUG build-rel/build.ninja; then
            echo 'Unexpected NDEBUG in build-rel.'; exit 1
          fi
          cmake --build build-rel
          ctest --test-dir build-rel --output-on-failure --no-tests=error --output-junit ctest-junit.xml
          "$(cygpath -u "$PSMODERN_CI_PYTHON")" tools/check_rom_skips.py build-rel/ctest-junit.xml
  build-and-test-macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ninja
        run: brew install ninja
      - name: Build verified SDL2 (static, universal)
        run: |
          set -eu
          dir="$RUNNER_TEMP/sdl2"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/SDL2-2.32.10.tar.gz" https://www.libsdl.org/release/SDL2-2.32.10.tar.gz
          echo "5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165  $dir/SDL2-2.32.10.tar.gz" | shasum -a 256 -c --quiet
          tar -xzf "$dir/SDL2-2.32.10.tar.gz" -C "$dir"
          cmake -S "$dir/SDL2-2.32.10" -B "$dir/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF -DCMAKE_INSTALL_PREFIX="$dir/install"
          cmake --build "$dir/build"
          cmake --install "$dir/build"
      - name: Configure, build and test
        run: |
          set -eu
          dir="$RUNNER_TEMP/psmodern-z80-tests"
          mkdir -p "$dir"
          base=https://raw.githubusercontent.com/rejunity/z80-from-schematics/6b1ffceab57561881e9cae429182dc3d4fc28038/tests/z80test
          while read -r sum file; do
            curl -fsSL --retry 3 -o "$dir/$file" "$base/$file"
            echo "$sum  $dir/$file" | shasum -a 256 -c --quiet
          done <<'TESTS'
          4dbe34a28ed564ac782b538736e1a1c57c562876165a3294bd93af25ea3df653 z80flags.tap
          444582ddfa4d05711b6235e743ddf68295231e97ba92cc838c5d09a106c9a10f z80memptr.tap
          a35b3b269b58371015cf033f28a08ad1ac92cce6dd27b428caf67b7f9ce8f5b7 z80ccf.tap
          67e39cd3bbecedf1e406ea9ce99d55fc48c3b497e235f1c7406d1bc4406b7071 LICENSE.txt
          TESTS
          # The ROM tests are registered with no ROM: every one must skip.
          cmake -S . -B build-macos -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPSMODERN_ROM_TESTS=ON \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl2/install" -DPSMODERN_Z80_TEST_DIR="$dir"
          if grep -q NDEBUG build-macos/build.ninja; then
            echo 'Unexpected NDEBUG in build-macos.'; exit 1
          fi
          cmake --build build-macos
          ctest --test-dir build-macos --output-on-failure --no-tests=error --output-junit ctest-junit.xml
          python3 tools/check_rom_skips.py build-macos/ctest-junit.xml
          lipo build-macos/PSModern.app/Contents/MacOS/PSModern -verify_arch arm64
          lipo build-macos/PSModern.app/Contents/MacOS/PSModern -verify_arch x86_64
